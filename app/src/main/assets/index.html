/* Mobile-first usability improvements */

function save(){localStorage.setItem(KEY,JSON.stringify(data))}function saveCats(){localStorage.setItem(CATKEY,JSON.stringify(categories))}function load(){try{let x=localStorage.getItem(KEY);data=x?JSON.parse(x):seed.map(z=>({...z,id:uid()}));if(!Array.isArray(data))throw 0}catch(e){data=seed.map(z=>({...z,id:uid()}))}let example=data.find(x=>x.username==='raunaidczfe3766');if(example&&example.category==='กรอบแอส'&&example.details==='บัต Evo + 810')example.category='บัต Evo';try{let c=JSON.parse(localStorage.getItem(CATKEY)||'null');categories=Array.isArray(c)?c.filter(v=>typeof v==='string'&&v.trim()):[...DEFAULT_CATEGORIES]}catch(e){categories=[...DEFAULT_CATEGORIES]}DEFAULT_CATEGORIES.forEach(c=>{if(!categories.includes(c))categories.push(c)});data.forEach(x=>{if(x.category&&!categories.includes(x.category))categories.push(x.category)});try{categoryCovers=JSON.parse(localStorage.getItem(CATIMGKEY)||'{}')||{}}catch(e){categoryCovers={}}saveCats();save()}function fillCategorySelects(){let fc=$('cat'),ec=$('category'),fv=fc.value,ev=ec.value;fc.innerHTML='<option value="">ทุกหมวด</option>'+categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');ec.innerHTML=categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');fc.value=categories.includes(fv)?fv:'';ec.value=categories.includes(ev)?ev:(categories.includes('กรอบแอส')?'กรอบแอส':categories[0]||'')}

iv class="empty">ไม่พบไอดี</div>'}
let pendingImage=null;
function showImagePreview(src){$('imagePreview').src=src||'';$('imagePreview').hidden=!src}
$('imageFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('กรุณาเลือกไฟล์รูปภาพ');e.target.value='';return}try{pendingImage=await resizeImage(f);showImagePreview(pendingImage)}catch(err){alert('อ่านรูปภาพไม่สำเร็จ')}};
function resizeImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{const scale=Math.min(1,1200/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',0.78))};im.src=reader.result};reader.readAsDataURL(file)})}
$('removeImage').onclick=()=>{pendingImage='';$('imageFile').value='';showImagePreview('')};
function edit(x){$('form').reset();pendingImage=x?.image||null;showImagePreview(pendingImage);$('id').value=x?.id||'';$('title').textContent=x?'แก้ไขไอดี':'เพิ่มไอดี';fillCategorySelects();for(let k of ['username','category','status','price','date','buyer','details','notes'])$(k).value=x?.[k]??({category:categories.includes('กรอบแอส')?'กรอบแอส':categories[0],status:'พร้อมขาย'}[k]||'');$('edit').showModal()}
$('add').onclick=()=>edit();$('x').onclick=$('cancel').onclick=()=>$('edit').close();$('form').onsubmit=e=>{e.preventDefault();let id=$('id').value,x={id:id||uid()};for(let k of ['username','category','status','price','date','buyer','details','notes'])x[k]=$(k).value.trim();if(!x.username)return;x.image=pendingImage||'';let i=data.findIndex(z=>z.id===id);if(i<0)data.push(x);else data[i]=x;try{save();render();$('edit').close()}catch(err){alert('พื้นที่จัดเก็บอาจไม่เพียงพอ กรุณาใช้รูปที่มีขนาดเล็กลง')}};
$('list').onclick=e=>{let z=e.target.closest('button');if(!z)return;let id=Object.values(z.dataset)[0],x=data.find(v=>v.id===id);if(!x)return;if(z.dataset.edit)edit(x);if(z.dataset.sell){$('sid').value=id;$('sp').value=x.price||'';$('sd').value=new Date().toISOString().slice(0,10);$('sb').value=x.buyer||'';$('sell').showModal()}if(z.dataset.back){x.status='พร้อมขาย';x.date='';x.buyer='';save();render()}if(z.dataset.del&&confirm('ลบไอดี '+x.username+' ใช่หรือไม่?')){data=data.filter(v=>v.id!==id);save();render()}};
$('sx').onclick=$('sc').onclick=()=>$('sell').close();$('sf').onsubmit=e=>{e.preventDefault();let x=data.find(v=>v.id===$('sid').value);if(x){x.status='ขายแล้ว';x.price=$('sp').value;x.date=$('sd').value;x.buyer=$('sb').value;save();render()}$('sell').close()};

function dl(name,txt,type){let u=URL.createObjectURL(new Blob([txt],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}$('backup').onclick=()=>dl('rov-stock-backup.json',JSON.stringify(data,null,2),'application/json');$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x)||!x.every(y=>y.username&&y.category))throw 0;if(confirm('นำเข้า '+x.length+' รายการและแทนที่ข้อมูลปัจจุบัน?')){data=x.map(y=>({...y,id:y.id||uid(),status:['พร้อมขาย','จองแล้ว','ขายแล้ว'].includes(y.status)?y.status:'พร้อมขาย'}));save();render()}}catch(e){alert('ไฟล์ JSON ไม่ถูกต้อง')}e.target.value=''};$('manageCats').onclick=()=>{renderCatManager();$('catsDialog').showModal()};$('closeCats').onclick=()=>$ ('catsDialog').close();function renderCatManager(){$('catList').innerHTML=categories.map((c,i)=>`<div class="card" style="margin:7px 0;display:flex;gap:7px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:100px;overflow-wrap:anywhere">${esc(c)} <small>(${data.filter(x=>x.category===c).length} ไอดี)</small></span><label style="font-size:12px">รูปปก <input type="file" accept="image/*" data-cover="${i}" style="max-width:155px;padding:5px"></label><button data-rename="${i}">เปลี่ยนชื่อ</button><button class="danger" data-catdel="${i}">ลบ</button></div>`).join('')}$('addCat').onclick=()=>{let v=$('newCat').value.trim();if(!v)return alert('ใส่ชื่อหมวดก่อน');if(categories.some(c=>c.toLowerCase()===v.toLowerCase()))return alert('มีหมวดนี้แล้ว');categories.push(v);saveCats();$('newCat').value='';renderCatManager();render()};$('catList').onchange=async e=>{let inp=e.target.closest('input[data-cover]');if(!inp||!inp.files[0])return;let cat=categories[Number(inp.dataset.cover)];try{categoryCovers[cat]=await resizeImage(inp.files[0]);localStorage.setItem(CATIMGKEY,JSON.stringify(categoryCovers));render();renderCatManager();alert('บันทึกรูปปกหมวด '+cat+' แล้ว')}catch(err){alert('บันทึกรูปไม่สำเร็จ')}};$('catList').onclick=e=>{let b=e.target.closest('button');if(!b)return;let i=Number(b.dataset.rename??b.dataset.catdel),old=categories[i];if(b.dataset.rename!==undefined){let v=prompt('แก้ชื่อหมวดหมู่',old);if(!v||!v.trim())return;v=v.trim();if(categories.some((c,j)=>j!==i&&c.toLowerCase()===v.toLowerCase()))return alert('มีชื่อนี้แล้ว');categories[i]=v;data.forEach(x=>{if(x.category===old)x.category=v});if(categoryCovers[old]){categoryCovers[v]=categoryCovers[old];delete categoryCovers[old];localStorage.setItem(CATIMGKEY,JSON.stringify(categoryCovers))}}else{let used=data.some(x=>x.category===old);if(used)return alert('หมวดนี้ยังมีไอดีอยู่ กรุณาย้ายหรือลบไอดีในหมวดนี้ก่อน');if(!confirm('ลบหมวด '+old+' ?'))return;categories.splice(i,1);delete categoryCovers[old];localStorage.setItem(CATIMGKEY,JSON.stringify(categoryCovers))}saveCats();save();renderCatManager();render()};
